name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/wisp_mcp
      - run: bandit -q -r src
      - run: bash -n setup.sh install-vps.sh scripts/wisp-mcp-openai-setup
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: python -m json.tool server.json >/dev/null
      - run: pytest
      - run: python -m build
