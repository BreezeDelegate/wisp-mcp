name: Release and MCP Registry

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "$VERSION" = "$PACKAGE_VERSION"
          python - <<'PYCODE'
          import json, os
          version=os.environ["GITHUB_REF_NAME"].removeprefix("v")
          manifest=json.load(open("manifest.json"))
          assert manifest["version"] == version, (manifest["version"], version)
          PYCODE

      - name: Test and build Python artifacts
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest
          python -m build

      - name: Build MCP Bundle
        run: |
          npm install --global @anthropic-ai/mcpb@2.1.2
          mcpb validate manifest.json
          VERSION="${GITHUB_REF_NAME#v}"
          mcpb pack . "dist/wisp-mcp-${VERSION}.mcpb"

      - name: Render registry metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HASH=$(sha256sum "dist/wisp-mcp-${VERSION}.mcpb" | awk '{print $1}')
          python - "$VERSION" "$HASH" <<'PYCODE'
          import json, sys
          version, digest = sys.argv[1:]
          path="server.json"
          data=json.load(open(path))
          data["version"]=version
          package=data["packages"][0]
          package["identifier"]=f"https://github.com/BreezeDelegate/wisp-mcp/releases/download/v{version}/wisp-mcp-{version}.mcpb"
          package["version"]=version
          package["fileSha256"]=digest
          with open(path,"w") as f:
              json.dump(data,f,indent=2)
              f.write("\n")
          PYCODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*             --title "Wisp MCP ${GITHUB_REF_NAME#v}"             --generate-notes

      - name: Install MCP Registry publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
