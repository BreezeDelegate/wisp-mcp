server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    location = /fr { return 308 /; }
    location = /fr/ { return 308 /; }

    # CSS/JS are referenced with a content fingerprint in the query string.
    # Long caching is safe because each new asset revision gets a new cache key.
    location ~* [.](?:css|js|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # HTML always revalidates so it points at the current asset fingerprints.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
