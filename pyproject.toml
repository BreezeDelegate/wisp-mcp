[project]
name = "wisp-mcp"
version = "1.0.0"
description = "MCP server for the Wisp game panel Client API"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["wisp", "mcp", "game-server", "server-management"]
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.28.1,<1",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
wisp-mcp = "wisp_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/BreezeDelegate/wisp-mcp"
Repository = "https://github.com/BreezeDelegate/wisp-mcp"
Issues = "https://github.com/BreezeDelegate/wisp-mcp/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=wisp_mcp --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
